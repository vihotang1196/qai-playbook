project_id = "hkqzzfyigmvisaftdmwh"

# Shared GHL identity function — called by the frontend with the anon key
# (no user JWT), so verification is off at the gateway. It runs with the
# service role internally and scopes every query by the request's location_id.
[functions.ghl]
verify_jwt = false

# GHL sub-account sync — called from the admin (anon key). Reads the PIT from
# the GHL_AGENCY_API_KEY secret; runs with the service role internally.
[functions.sync-ghl-locations]
verify_jwt = false

# Review Boost customer-scoped data (platforms/campaigns for the caller's OWN
# location_id). Anon-callable; every query is scoped by location_id.
[functions.rb]
verify_jwt = false

# Review Boost AI review generation (Claude). Anon-callable: preview is scoped by
# location_id; the Phase 7 scan flow is public. Reads ANTHROPIC_API_KEY secret.
[functions.generate-review]
verify_jwt = false

# Admin Portal (platform-wide). Anon-callable at the gateway; the REAL gate is
# requireAdmin() inside — it validates the caller's session JWT + checks the
# platform_admins allowlist before any privileged work.
[functions.admin]
verify_jwt = false

# Offline Event admin (nested in the Admin Portal). Anon-callable at the gateway;
# the REAL gate is requireAdmin() inside. Runs with the service role internally;
# the frontend never touches the RLS-locked oe_ tables.
[functions.offline-event-admin]
verify_jwt = false
