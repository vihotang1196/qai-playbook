project_id = "hkqzzfyigmvisaftdmwh"

# Shared GHL identity function — called by the frontend with the anon key
# (no user JWT), so verification is off at the gateway. It runs with the
# service role internally and scopes every query by the request's location_id.
[functions.ghl]
verify_jwt = false

# GHL sub-account sync — called from the admin (anon key). Reads the PIT from
# the GHL_AGENCY_API_KEY secret; runs with the service role internally.
[functions.sync-ghl-locations]
verify_jwt = false

# Review Boost customer-scoped data (platforms/campaigns for the caller's OWN
# location_id). Anon-callable; every query is scoped by location_id.
[functions.rb]
verify_jwt = false

# Review Boost AI review generation (Claude). Anon-callable: preview is scoped by
# location_id; the Phase 7 scan flow is public. Reads ANTHROPIC_API_KEY secret.
[functions.generate-review]
verify_jwt = false

# Admin Portal (platform-wide). Anon-callable at the gateway; the REAL gate is
# requireAdmin() inside — it validates the caller's session JWT + checks the
# platform_admins allowlist before any privileged work.
[functions.admin]
verify_jwt = false

# Offline Event admin (nested in the Admin Portal). Anon-callable at the gateway;
# the REAL gate is requireAdmin() inside. Runs with the service role internally;
# the frontend never touches the RLS-locked oe_ tables.
[functions.offline-event-admin]
verify_jwt = false

# Offline Event customer-scoped data (events / seat map for the caller's OWN
# location_id). Anon-callable; every action requires + is scoped by location_id
# and gated by location_tool_access(offline_event).
[functions.oe]
verify_jwt = false

# Offline Event Stripe webhook — called DIRECTLY by Stripe (not the browser), so
# verify_jwt is off at the gateway; the REAL gate is the Stripe signature check
# (constructEventAsync with STRIPE_WEBHOOK_SECRET_TEST/LIVE, per the active mode).
# Marks paid bookings
# confirmed / expired bookings cancelled + releases their seats.
[functions.oe-stripe-webhook]
verify_jwt = false

# Helpdesk admin (agency-internal — the shared help center). Anon-callable at the
# gateway; the REAL gate is requireAdmin() inside. Runs with the service role;
# the frontend never touches hd_ tables directly.
[functions.helpdesk-admin]
verify_jwt = false

# Helpdesk AI chat (public "Angel AI"). Anon-callable — the widget + the admin
# test page both call it. Runs with the service role to read the KB (RLS-locked)
# and log conversations. Reads ANTHROPIC_API_KEY secret.
[functions.helpdesk-chat]
verify_jwt = false

# Helpdesk PUBLIC read API — the customer help center (widget) reads the shared
# KB through here. Anon-callable; runs with the service role internally. READ
# ONLY (listFolders / listArticles / getArticle); no writes, no secrets, no
# per-location scoping (the help center is agency-wide shared content).
[functions.helpdesk]
verify_jwt = false
